# Visual regression gate for Vercel preview deployments.
#
# Fires on every `deployment_status` event from Vercel; filters to successful
# Preview deploys and runs Playwright snapshots against the preview URL. On
# failure, the playwright-report/ and test-results/ directories are uploaded
# as artifacts so Drew (or scout) can diff locally, and a sticky comment
# is posted/updated on the associated PR with a link to the failure artifacts.
#
# Related:
# - openspec/changes/dcyfr-skeleton-sites-scaffolding/spec.md#5-polish-loop
# - e2e/snapshots.spec.ts (routes + viewports)
# - playwright.config.ts (baseURL reads BASE_URL; extraHTTPHeaders reads
#   VERCEL_AUTOMATION_BYPASS_SECRET when Deployment Protection is on)
#
# Required repo secret: VERCEL_AUTOMATION_BYPASS_SECRET (generate per Vercel
# project: Settings -> Deployment Protection -> Protection Bypass for Automation).
# Without it, Playwright captures the Vercel SSO login page on protected previews.
#
# Manual runs: workflow_dispatch accepts a `base_url` override for debugging,
# and an `update_baselines` switch that regenerates the PNGs ON THE RUNNER and
# uploads them as an artifact to commit.
#
# That switch exists because baselines have to come from x86 CI and there was
# previously no way to get one. Artifacts upload only on failure, so a passing
# run yields nothing to harvest, and the only documented update path was
# `npm run test:snapshots:update` on a dev machine. On arm64 that is wrong for
# both viewports: mobile text wraps differently and hard-fails on size, and
# desktop silently absorbs ~57k pixels of antialiasing noise into the 5%
# tolerance (measured 2026-08-31 at dcyfr-io on a build proven pixel-identical
# to its predecessor).
#
# The switch regenerates with `--update-snapshots=all`, deliberately. A bare
# `--update-snapshots` means `changed`, which rewrites a baseline only when the
# render FAILED the comparison. Any correction smaller than the 5%
# maxDiffPixelRatio therefore cannot be recorded at all: the run passes, writes
# nothing, and the stale PNG survives its own regeneration. Confirmed at
# dcyfr-io on 2026-08-31, where the first dispatch returned baselines
# byte-identical by sha256 to the committed ones for a real change.

# The regeneration switch additionally refuses to run unless `base_url`
# resolves, through the GitHub deployments API, to a deployment built from this
# run's HEAD commit — see the step comment on "Verify base_url was built from
# HEAD". The uploaded artifact carries a `baseline-source.json` recording the
# deployment the PNGs were captured from, so a reviewer does not have to
# re-derive it.

name: Visual Regression

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: Preview URL to run snapshots against
        required: true
        type: string
      update_baselines:
        description: >-
          Regenerate baselines against base_url and upload them as the
          `updated-baselines` artifact instead of asserting against the
          committed PNGs. Download, commit the PNGs, push.
        required: false
        default: false
        type: boolean

concurrency:
  group: visual-regression-${{ github.event.deployment_status.target_url || inputs.base_url }}
  cancel-in-progress: true

jobs:
  # Resolve the PR behind a Vercel preview deploy and decide whether the
  # snapshot suite is worth running. Dependabot deps-only PRs (package.json /
  # package-lock.json) cannot change rendered pixels, yet each one gets a fresh
  # preview whose page height differs from the committed baseline -> false red.
  # A deployment_status event carries no PR author in its context, so this has
  # to be resolved with an API lookup rather than a job-level `if:`.
  guard:
    name: Resolve deploy context
    runs-on: ubuntu-latest
    # Gate on Vercel preview success. Manual dispatch skips the gate.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Preview')
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Skip Dependabot deps-only previews
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            // workflow_dispatch (manual) has no deployment/PR context -> run.
            if (context.eventName !== 'deployment_status') {
              core.setOutput('skip', 'false');
              return;
            }
            const sha = context.payload.deployment?.sha;
            if (!sha) {
              core.setOutput('skip', 'false');
              return;
            }
            const { data: prs } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha,
              });
            const pr = prs.find((p) => p.state === 'open') ?? prs[0];
            if (!pr || pr.user?.login !== 'dependabot[bot]') {
              core.setOutput('skip', 'false');
              return;
            }
            // Only skip when every changed file is a lockfile/manifest — an
            // actions bump or a Dependabot PR that also touches source still
            // runs the gate.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const depsOnly =
              files.length > 0 &&
              files.every((f) =>
                /(^|\/)(package\.json|package-lock\.json)$/.test(f.filename),
              );
            core.setOutput('skip', String(depsOnly));
            if (depsOnly) {
              core.notice(
                `Visual regression skipped: Dependabot deps-only PR #${pr.number}`,
              );
            }

  snapshots:
    name: Playwright snapshots
    needs: guard
    # `needs: guard` makes this skip on non-preview events (guard is skipped
    # there); when guard runs, honour its deps-only skip decision.
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Required for the diff-comment step to read + write PR comments.
      contents: read
      pull-requests: write
      # Required to resolve base_url back to a deployment sha before
      # regenerating baselines.
      deployments: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve BASE_URL
        id: base
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "url=${{ inputs.base_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ github.event.deployment_status.target_url }}" >> "$GITHUB_OUTPUT"
          fi

      # `base_url` is free text: nothing about it proves the render behind it was
      # built from the commit the regenerated PNGs will be committed onto. A
      # dispatch against a stale preview, or against an older production
      # deploy, yields baselines that look authoritative and describe a render
      # that no longer exists.
      #
      # Not hypothetical. Fleet-wide on 2026-09-01, four repos carried mobile
      # baselines captured before the `Privacy / Terms / Security` footer row
      # was rendering — even though app/layout.tsx was byte-identical between
      # the commit the baselines were committed in and main, and already had
      # the links. Every mobile baseline was 28px short (dcyfr-io was 128px
      # long, from a footer restructure the other way). A size mismatch is not
      # covered by maxDiffPixelRatio; it hard-fails. Those baselines had been
      # red since before they were committed.
      #
      # Resolution goes through the deployments API: find the deployment whose
      # status environment_url/target_url is base_url, and require its sha to
      # be this run's HEAD. The assert path (update_baselines: false) is left
      # unguarded on purpose — running it against an arbitrary URL is
      # legitimate debugging.
      - name: Verify base_url was built from HEAD
        id: deployment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
        uses: actions/github-script@v7
        env:
          BASE_URL: ${{ steps.base.outputs.url }}
        with:
          script: |
            // Compare on origin. Vercel records a bare deployment URL, while a
            // hand-pasted base_url routinely carries a trailing slash, a route,
            // or no scheme at all.
            const toOrigin = (raw) => {
              const trimmed = String(raw ?? '').trim();
              if (!trimmed) return null;
              try {
                const withScheme = /^https?:\/\//i.test(trimmed)
                  ? trimmed
                  : `https://${trimmed}`;
                return new URL(withScheme).origin.toLowerCase();
              } catch {
                return null;
              }
            };

            const target = toOrigin(process.env.BASE_URL);
            if (!target) {
              core.setFailed(
                `base_url is not a URL: ${JSON.stringify(process.env.BASE_URL)}`,
              );
              return;
            }

            // A deployment's URL lives on its statuses, not on the deployment.
            const originsFor = async (deploymentId) => {
              const { data: statuses } =
                await github.rest.repos.listDeploymentStatuses({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deploymentId,
                  per_page: 100,
                });
              const origins = new Set();
              for (const status of statuses) {
                for (const url of [status.environment_url, status.target_url]) {
                  const origin = toOrigin(url);
                  if (origin) origins.add(origin);
                }
              }
              return origins;
            };

            // Only a deployment of HEAD can pass, so ask for those first —
            // this is one page in practice, and avoids a scan on the happy
            // path.
            const headDeployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                per_page: 100,
              },
            );

            for (const deployment of headDeployments) {
              if (!(await originsFor(deployment.id)).has(target)) continue;
              core.info(
                `${target} is deployment ${deployment.id} ` +
                  `(${deployment.environment}), built from ${context.sha} — ` +
                  'matches HEAD.',
              );
              core.setOutput('id', String(deployment.id));
              core.setOutput('sha', deployment.sha);
              core.setOutput('environment', deployment.environment ?? '');
              core.setOutput('created_at', deployment.created_at ?? '');
              return;
            }

            // No match at HEAD. Scan recent deployments so the failure can name
            // the commit the URL actually belongs to. Bounded and best-effort:
            // this costs one status lookup per deployment, and a diagnostic
            // must not be what fails the step.
            const SCAN_LIMIT = 100;
            let culprit = null;
            try {
              const { data: recent } = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: SCAN_LIMIT,
              });
              for (const deployment of recent) {
                if ((await originsFor(deployment.id)).has(target)) {
                  culprit = deployment;
                  break;
                }
              }
            } catch (error) {
              core.warning(
                `Could not scan recent deployments for ${target}: ${error.message}`,
              );
            }

            const lines = [
              `Refusing to regenerate baselines from ${target}.`,
              '',
              `HEAD of this run is ${context.sha} (${context.ref}).`,
            ];
            if (culprit) {
              lines.push(
                `${target} was built from ${culprit.sha} (deployment ` +
                  `${culprit.id}, ${culprit.environment}, created ` +
                  `${culprit.created_at}).`,
                '',
                'PNGs captured from it would describe a render this commit does',
                'not produce. Dispatch against the deployment for',
                `${context.sha} instead.`,
              );
            } else {
              lines.push(
                `No deployment of ${context.sha} reports ${target}, and none of`,
                `the ${SCAN_LIMIT} most recent deployments claims it either.`,
                '',
                'Use the deployment\'s own `environment_url`. A branch alias or a',
                'custom domain is not recorded on the deployment status, so it',
                'cannot be resolved back to a commit.',
              );
            }
            core.setFailed(lines.join('\n'));

      # Runs before the snapshot suite on purpose. The pixel gate cannot see
      # invisible text: in the slate palette dark --primary and dark --foreground
      # are the same value, so a bg-primary fill wearing text-foreground renders
      # white-on-white and diffs to a handful of pixels well inside the 5%
      # tolerance. Contrast is measured, not diffed, and needs no baseline.
      - name: Run contrast gate (light + dark)
        env:
          BASE_URL: ${{ steps.base.outputs.url }}
          CI: "true"
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:contrast

      - name: Run snapshot suite
        env:
          BASE_URL: ${{ steps.base.outputs.url }}
          CI: "true"
          # See header comment: required for protected preview deploys.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          UPDATE_BASELINES: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
        run: |
          if [ "$UPDATE_BASELINES" = "true" ]; then
            # :rebaseline, not :update. A bare --update-snapshots means
            # `changed`, which rewrites a PNG only when the render FAILED the
            # comparison — so any correction smaller than maxDiffPixelRatio
            # cannot be recorded, and the run reports success having changed
            # nothing. =all writes unconditionally.
            npm run test:snapshots:rebaseline
          else
            npm run test:snapshots
          fi

      # Provenance travels with the pixels. Without it `updated-baselines` is a
      # bag of images whose source deploy has to be re-derived by hand, which is
      # exactly the step nobody took when the stale mobile baselines landed.
      # Written into the snapshot dir so it sits beside the PNGs in the
      # artifact; it is not a snapshot and Playwright ignores it.
      - name: Stamp baseline provenance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
        uses: actions/github-script@v7
        env:
          BASE_URL: ${{ steps.base.outputs.url }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          DEPLOYMENT_SHA: ${{ steps.deployment.outputs.sha }}
          DEPLOYMENT_ENVIRONMENT: ${{ steps.deployment.outputs.environment }}
          DEPLOYMENT_CREATED_AT: ${{ steps.deployment.outputs.created_at }}
        with:
          script: |
            const fs = require('fs');
            const dir = 'e2e/snapshots.spec.ts-snapshots';
            const manifest = {
              repository: `${context.repo.owner}/${context.repo.repo}`,
              head_sha: context.sha,
              ref: context.ref,
              base_url: process.env.BASE_URL,
              deployment: {
                id: Number(process.env.DEPLOYMENT_ID),
                sha: process.env.DEPLOYMENT_SHA,
                environment: process.env.DEPLOYMENT_ENVIRONMENT,
                created_at: process.env.DEPLOYMENT_CREATED_AT,
              },
              runner_os: process.env.RUNNER_OS,
              runner_arch: process.env.RUNNER_ARCH,
              run_url:
                `${context.serverUrl}/${context.repo.owner}/` +
                `${context.repo.repo}/actions/runs/${context.runId}`,
              snapshots: fs
                .readdirSync(dir)
                .filter((name) => name.endsWith('.png'))
                .sort(),
            };
            fs.writeFileSync(
              `${dir}/baseline-source.json`,
              `${JSON.stringify(manifest, null, 2)}\n`,
            );
            core.info(
              `Stamped ${dir}/baseline-source.json ` +
                `(deployment ${process.env.DEPLOYMENT_ID}, ` +
                `sha ${process.env.DEPLOYMENT_SHA}).`,
            );

      # Unconditional (not `if: failure()`) — a regeneration run passes by
      # definition, so gating this on failure is what made CI-rendered
      # baselines unobtainable in the first place.
      - name: Upload regenerated baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
        uses: actions/upload-artifact@v4
        with:
          name: updated-baselines
          path: e2e/snapshots.spec.ts-snapshots/
          retention-days: 14
          if-no-files-found: error

      - name: Upload playwright-report on failure
        id: upload
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Post sticky PR comment on diff
        if: failure() && github.event_name == 'deployment_status'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.base.outputs.url }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const sha = context.payload.deployment?.sha;
            if (!sha) {
              core.info('No deployment.sha on this event; skipping PR lookup.');
              return;
            }

            // Find the PR(s) associated with this commit.
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });

            if (prs.length === 0) {
              core.info(`No open PR associated with ${sha}; skipping comment.`);
              return;
            }

            const marker = '<!-- visual-regression-bot -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const previewUrl = process.env.PREVIEW_URL;
            const artifactUrl = process.env.ARTIFACT_URL;

            const body = [
              marker,
              '## 🔍 Visual regression',
              '',
              `Snapshot mismatch detected against preview: ${previewUrl}`,
              '',
              `- **Workflow run:** ${runUrl}`,
              artifactUrl
                ? `- **Failure artifacts:** [playwright-report.zip](${artifactUrl})`
                : '- **Failure artifacts:** see the workflow run artifacts page',
              '',
              'If the change is intentional, regenerate the baselines **on the runner** —',
              'run this workflow via `workflow_dispatch` with `update_baselines: true`',
              `and \`base_url: ${previewUrl}\`, then download the \`updated-baselines\``,
              'artifact and commit its PNGs.',
              '',
              'The regeneration run refuses any `base_url` that was not built from the',
              'branch HEAD, so if you have pushed since this comment, dispatch against',
              'the newest preview instead.',
              '',
              'Do not regenerate on an arm64 dev machine: mobile wraps differently and',
              'hard-fails on size, and desktop bakes ~57k pixels of antialiasing noise',
              'into the 5% tolerance.',
              '',
              'Otherwise investigate the diff before merging.',
            ].join('\n');

            for (const pr of prs) {
              // Look for an existing sticky comment to update in place.
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const existing = comments.find((c) => c.body?.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
                core.info(`Updated sticky comment on PR #${pr.number}.`);
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body,
                });
                core.info(`Posted sticky comment on PR #${pr.number}.`);
              }
            }
